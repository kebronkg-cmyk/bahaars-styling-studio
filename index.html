  <!-- ── Die Bühne ──────────────────────────────────────────────────────
       Hahn, Wasser und Film stehen in einem gemeinsamen Rahmen: Der
       Scheitel liegt bei 49 % der Filmbreite, dort hängt der Auslauf,
       und dort fällt das Wasser. Weil der Film waagerecht nicht
       beschnitten wird, stimmt das ohne Rechnerei — und nichts muss sich
       bewegen, um es zusammenzuhalten.                                -->
  <div class="buehne">

    <!-- Der Strahl ist gezeichnet, nicht gefilmt. In der Aufnahme
         schwankt er um 20 % der Bildbreite; ihn unter einem festen
         Auslauf zu halten hiesse, das ganze Bild mitzuschieben, und das
         sieht man. Also ist er aus dem Film herausgeschnitten. -->
    <div class="strahl" id="strahl" aria-hidden="true">
      <span class="strahl-kern"></span>
      <span class="strahl-saum"></span>
      <span class="strahl-aufschlag"></span>
